name: Build TrafficMonitor Plugins

on:
  workflow_dispatch:
  push:
    paths:
      - "Plugins/AMPManager/**"
      - "Plugins/LiveWebUIViewer/**"
      - "include/**"
      - "utilities/**"
      - "TrafficMonitorPlugins.sln"
      - ".github/workflows/build-ampmanager.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        platform: [x64, x86]
        project: [AMPManager, LiveWebUIViewer]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install MFC libraries
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if ([string]::IsNullOrWhiteSpace($installPath)) {
            throw "Visual Studio installation path was not found."
          }

          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          Write-Host "Installing MFC into $installPath"
          & $setup modify `
            --installPath $installPath `
            --add Microsoft.VisualStudio.Component.VC.ATLMFC `
            --quiet --norestart --force
          if ($LASTEXITCODE -notin 0, 3010) {
            throw "Failed to install MFC components. Exit code: $LASTEXITCODE"
          }

      - name: Build plugin
        shell: pwsh
        run: |
          msbuild TrafficMonitorPlugins.sln `
            /m `
            /t:${{ matrix.project }} `
            /p:Configuration=Release `
            /p:Platform=${{ matrix.platform }}

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-${{ matrix.platform }}
          path: |
            bin/${{ matrix.platform }}/Release/${{ matrix.project }}.dll
            bin/Release/${{ matrix.project }}.dll
          if-no-files-found: error

  package-ampmanager-download:
    needs: build
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download AMPManager x64
        uses: actions/download-artifact@v4
        with:
          name: AMPManager-x64
          path: artifacts/AMPManager-x64

      - name: Download AMPManager x86
        uses: actions/download-artifact@v4
        with:
          name: AMPManager-x86
          path: artifacts/AMPManager-x86

      - name: Package AMPManager download zips
        shell: pwsh
        run: |
          $version = "1.08"
          New-Item -ItemType Directory -Force -Path download/AMPManager | Out-Null
          $x64Dll = Get-ChildItem artifacts/AMPManager-x64 -Recurse -Filter AMPManager.dll | Select-Object -First 1
          $x86Dll = Get-ChildItem artifacts/AMPManager-x86 -Recurse -Filter AMPManager.dll | Select-Object -First 1
          if ($null -eq $x64Dll -or $null -eq $x86Dll) {
            Get-ChildItem artifacts -Recurse | Select-Object FullName
            throw "AMPManager.dll artifact was not found."
          }
          Compress-Archive -Path $x64Dll.FullName -DestinationPath "download/AMPManager/AMPManager_V$($version)_x64.zip" -Force
          Compress-Archive -Path $x86Dll.FullName -DestinationPath "download/AMPManager/AMPManager_V$($version)_x86.zip" -Force

      - name: Commit AMPManager download zips
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download/AMPManager/AMPManager_V1.08_x64.zip download/AMPManager/AMPManager_V1.08_x86.zip
          if ((git status --porcelain).Length -eq 0) {
            Write-Host "No AMPManager download zip changes to commit."
            exit 0
          }
          git commit -m "chore: 添加 AMP Manager 1.08 插件下载包"
          git push origin HEAD:${{ github.ref_name }}
