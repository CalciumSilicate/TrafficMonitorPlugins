name: Build TrafficMonitor Plugins

on:
  workflow_dispatch:
  push:
    paths:
      - "Plugins/AMPManager/**"
      - "Plugins/LiveWebUIViewer/**"
      - "include/**"
      - "utilities/**"
      - "TrafficMonitorPlugins.sln"
      - ".github/workflows/build-ampmanager.yml"

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        platform: [x64, x86]
        project: [AMPManager, LiveWebUIViewer]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build plugin
        shell: pwsh
        run: |
          msbuild TrafficMonitorPlugins.sln `
            /m `
            /t:${{ matrix.project }} `
            /p:Configuration=Release `
            /p:Platform=${{ matrix.platform }}

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-${{ matrix.platform }}
          path: |
            bin/${{ matrix.platform }}/Release/${{ matrix.project }}.dll
            bin/Release/${{ matrix.project }}.dll
          if-no-files-found: error
